<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지를 찾을 수 없습니다 — Shoplive Events</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" id="icon" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0A0A0A;
    color: #fff;
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    word-break: keep-all;
  }
  strong { display: block; font-size: 56px; letter-spacing: -.03em; color: #EA1525; }
  p { margin: 8px 0 28px; color: #8A8A8A; font-size: 15px; }
  a { color: #fff; font-size: 14px; text-underline-offset: 4px; }
</style>
</head>
<body>
<main>
  <strong>404</strong>
  <p>요청하신 페이지를 찾을 수 없습니다.</p>
  <a href="/" id="home">행사 목록으로 돌아가기</a>
</main>
<script>
  /* This page is rendered at whatever URL 404'd, so the way back has to be
     worked out rather than written down. A custom domain serves the site at
     the root; github.io serves it as a project page under /<repo>/. */
  var segment = location.pathname.split('/')[1];
  if (location.hostname.endsWith('.github.io') && segment) {
    document.getElementById('home').href = '/' + segment + '/';
    document.getElementById('icon').href = '/' + segment + '/favicon.svg';
  }
</script>
</body>
</html>
