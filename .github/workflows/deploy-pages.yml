name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that every local asset reference resolves
        run: python3 tools/check_links.py

      # enablement lets the first run turn Pages on itself; without it the
      # action fails with "Get Pages site failed" until someone flips the
      # source to GitHub Actions by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The repository root is the site root: / is the event index and
      # /summit-2026/ is the summit page.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
