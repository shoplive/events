<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shoplive Events</title>
<meta name="description" content="샵라이브가 여는 행사 안내." />
<meta name="theme-color" content="#0A0A0A" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0A0A0A;
    color: #fff;
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 520px; }
  h1 { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8A8A8A; }
  p { margin: 0 0 32px; color: #8A8A8A; font-size: 14px; }
  ul { margin: 0; padding: 0; list-style: none; }
  li + li { margin-top: 12px; }
  a {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 20px 22px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    transition: border-color .2s ease, background .2s ease;
  }
  a:hover, a:focus-visible { border-color: #EA1525; background: rgba(234,21,37,.08); }
  .t { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .d { margin-left: auto; font-size: 13px; color: #8A8A8A; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Shoplive Events</h1>
  <p>샵라이브가 여는 행사를 안내합니다.</p>
  <ul>
    <li>
      <a href="/summit-2026/">
        <span class="t">Video Commerce Summit 2026</span>
        <span class="d">초대 전용</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
